<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Ill Radio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Mono', monospace;
    background: #000;
    color: #fff;
    height: 100vh;
    overflow: hidden;
  }

  .bg {
    position: fixed; top: 0; bottom: 0;
    left: 50%;
    width: 900px; max-width: 75vw;
    margin-left: -450px;
    background:
      radial-gradient(ellipse at 30% 70%, rgba(242,140,40,0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 30%, rgba(245,208,32,0.1) 0%, transparent 50%),
      linear-gradient(160deg, #e890b5 0%, #d4729a 50%, #b85a88 100%);
    z-index: 0;
    filter: brightness(0.5) blur(8px);
    transition: transform 0.15s ease;
  }
  @media (max-width: 1200px) {
    .bg { margin-left: -37.5vw; }
  }

  /* --- GRAIN OVERLAY --- */
  .grain {
    position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 900px; max-width: 75vw; z-index: 1;
    pointer-events: none;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px;
    animation: grainShift 0.5s steps(3) infinite;
  }
  @keyframes grainShift {
    0% { transform: translate(0, 0); }
    33% { transform: translate(-2px, 1px); }
    66% { transform: translate(1px, -2px); }
    100% { transform: translate(0, 0); }
  }

  .layer {
    position: relative; z-index: 2;
    height: 100vh;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 24px 40px; max-width: 900px; margin: 0 auto;
  }

  /* --- LOGO --- */
  .logo-wrap {
    position: fixed; top: 16px; left: calc(50% - 410px); z-index: 10;
    display: flex; align-items: flex-start; gap: 16px;
  }
  .logo-wrap img {
    height: 38px; width: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }

  .socials {
    position: fixed; top: 20px; right: calc(50% - 410px);
    display: flex; gap: 20px; z-index: 10;
  }
  .socials a {
    color: #fff; opacity: 0.5; text-decoration: none;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    transition: all 0.3s;
  }
  .socials a:hover { opacity: 1; color: #f28c28; }

  /* --- SET LIST --- */
  .sets-area {
    flex-shrink: 0;
    max-height: 55vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .sets-area::-webkit-scrollbar { width: 3px; }
  .sets-area::-webkit-scrollbar-track { background: transparent; }
  .sets-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

  .sets { display: flex; flex-direction: column; gap: 4px; max-width: 500px; }

  .set-btn {
    background: none; border: none; color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: clamp(14px, 2.5vw, 20px);
    text-align: left; padding: 8px 0;
    cursor: pointer; opacity: 0.4;
    transition: all 0.3s ease; position: relative;
  }
  .set-btn:hover { opacity: 0.8; }
  .set-btn.active { opacity: 1; padding-left: 24px; }
  .set-btn.active::before {
    content: '▸'; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); font-size: 12px; color: #f28c28;
  }
  .set-btn .dur { font-size: 10px; opacity: 0.45; margin-left: 12px; }

  /* --- PANEL --- */
  .panel {
    position: fixed; top: 0; right: calc(50% - 450px);
    width: 380px; max-width: 85vw; height: 100vh;
    background: rgba(72, 20, 48, 0.92);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-left: 1px solid rgba(255,255,255,0.08);
    z-index: 20;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column; overflow-y: auto;
    color: #fff;
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .panel-close {
    background: none; border: none; color: #fff; font-size: 20px;
    cursor: pointer; opacity: 0.4; float: right;
    font-family: 'Space Mono', monospace; transition: opacity 0.3s;
  }
  .panel-close:hover { opacity: 1; }
  .panel-title {
    font-size: 18px; font-weight: 700; margin-bottom: 4px;
    color: #f28c28;
  }
  .panel-info { font-size: 11px; opacity: 0.4; letter-spacing: 0.05em; }

  /* --- PLAYER --- */
  .player {
    padding: 18px 20px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .player-row {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  }

  .play-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid #f28c28; background: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .play-btn:hover { background: #f28c28; }
  .play-btn:hover svg { fill: #481430; }
  .play-btn svg { width: 16px; height: 16px; fill: #f28c28; transition: fill 0.2s; }

  .skip-btn {
    width: 34px; height: 34px;
    background: none; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; opacity: 0.4; transition: opacity 0.2s;
    color: #fff;
  }
  .skip-btn:hover { opacity: 0.9; }
  .skip-btn svg { width: 22px; height: 22px; fill: #fff; }

  /* --- VERTICAL BARS --- */
  .viz-canvas {
    position: fixed;
    top: 0; left: calc(50% - 450px);
    width: 60px; height: 100vh;
    z-index: 19;
    pointer-events: none;
  }

  .player-time {
    flex: 1; display: flex; justify-content: space-between;
    font-size: 10px; opacity: 0.4; letter-spacing: 0.05em;
  }

  .player-volume { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .vol-icon { opacity: 0.3; cursor: pointer; transition: opacity 0.2s; }
  .vol-icon:hover { opacity: 0.8; }
  .vol-icon svg { width: 14px; height: 14px; fill: #fff; }

  .vol-slider {
    -webkit-appearance: none; appearance: none;
    width: 50px; height: 2px; background: rgba(255,255,255,0.15);
    outline: none; border-radius: 1px;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 8px; height: 8px;
    border-radius: 50%; background: #f28c28; cursor: pointer;
  }
  .vol-slider::-moz-range-thumb {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f28c28; cursor: pointer; border: none;
  }

  .progress-wrap {
    width: 100%; height: 24px; display: flex; align-items: center;
    cursor: pointer; position: relative;
  }
  .progress-bar {
    width: 100%; height: 3px; background: rgba(255,255,255,0.1);
    border-radius: 2px; position: relative; overflow: visible;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f28c28, #f5d020);
    border-radius: 2px; width: 0%; position: relative;
    transition: width 0.1s linear;
  }
  .progress-head {
    position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; background: #f28c28; border-radius: 50%;
    box-shadow: 0 0 10px rgba(242,140,40,0.5);
    opacity: 0; transition: opacity 0.2s;
  }
  .progress-wrap:hover .progress-head { opacity: 1; }

  .progress-times {
    display: flex; justify-content: space-between;
    font-size: 10px; opacity: 0.3; margin-top: 8px; letter-spacing: 0.03em;
  }

  /* --- DOWNLOAD --- */
  .download-btn {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px;
    background: none; border: 1px solid rgba(255,255,255,0.12);
    color: #fff; opacity: 0.4;
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 4px;
    cursor: pointer; transition: all 0.25s; text-decoration: none;
  }
  .download-btn:hover { opacity: 0.9; border-color: #f28c28; color: #f28c28; }
  .download-btn svg { width: 12px; height: 12px; fill: currentColor; }

  /* --- TRACKLIST --- */
  .panel-tracklist { padding: 16px 20px 28px; flex: 1; overflow-y: auto; }
  .panel-tracklist::-webkit-scrollbar { width: 3px; }
  .panel-tracklist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .tl-heading {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.15em; opacity: 0.3; margin-bottom: 16px;
  }
  .tl-item {
    display: flex; gap: 14px; padding: 7px 0; font-size: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .tl-num { opacity: 0.5; min-width: 22px; font-size: 10px; padding-top: 2px; color: #f28c28; }
  .tl-artist { opacity: 0.9; }
  .tl-track { opacity: 0.4; }

  /* --- COMMENTS --- */
  .comments-area {
    padding: 16px 20px 28px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .comments-heading {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.15em; opacity: 0.3; margin-bottom: 14px;
  }
  .comment-name {
    width: 80px; flex-shrink: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: #fff; font-family: 'Space Mono', monospace;
    font-size: 10px; padding: 8px 8px; outline: none;
  }
  .comment-name::placeholder { color: rgba(255,255,255,0.2); }
  .comment-name:focus { border-color: rgba(255,255,255,0.25); }
  .comment-form {
    display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .comment-time {
    width: 60px; flex-shrink: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: #f28c28; font-family: 'Space Mono', monospace;
    font-size: 10px; text-align: center;
    padding: 8px 4px; outline: none;
  }
  .comment-time:focus { border-color: #f28c28; }
  .comment-input {
    flex: 1; min-width: 120px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: #fff; font-family: 'Space Mono', monospace;
    font-size: 11px; padding: 8px 10px; outline: none;
  }
  .comment-input::placeholder { color: rgba(255,255,255,0.2); }
  .comment-input:focus { border-color: rgba(255,255,255,0.25); }
  .comment-submit {
    background: none; border: 1px solid rgba(255,255,255,0.12);
    color: #f28c28; font-family: 'Space Mono', monospace;
    font-size: 10px; padding: 8px 12px; border-radius: 4px;
    cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .comment-submit:hover { background: #f28c28; color: #481430; }
  .comments-list {
    display: flex; flex-direction: column; gap: 0;
    max-height: 200px; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
  }
  .comments-list::-webkit-scrollbar { width: 3px; }
  .comments-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .comment-item {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 11px; align-items: flex-start;
  }
  .comment-stamp {
    color: #f28c28; font-size: 10px; opacity: 0.7;
    min-width: 50px; cursor: pointer; flex-shrink: 0;
    padding-top: 1px; transition: opacity 0.2s;
  }
  .comment-stamp:hover { opacity: 1; }
  .comment-text { opacity: 0.7; line-height: 1.4; flex: 1; }
  .comment-when { font-size: 9px; opacity: 0.25; white-space: nowrap; padding-top: 2px; }
  .no-comments { font-size: 11px; opacity: 0.2; font-style: italic; }
  .comment-pending { opacity: 0.5; }
  .comment-pending .comment-text { font-style: italic; }

  /* --- APPROVED COMMENTS (main area) --- */
  .approved-area {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 28px;
    overflow-y: auto;
    max-height: 40vh;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.06) transparent;
  }
  .approved-area::-webkit-scrollbar { width: 3px; }
  .approved-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .approved-comment {
    display: inline-block;
    max-width: 75%;
    padding: 10px 16px;
    font-size: 12px;
    opacity: 0;
    animation: floatIn 0.6s ease forwards;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 18px;
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .approved-comment:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .approved-comment:nth-child(odd) { align-self: flex-start; }
  .approved-comment:nth-child(even) { align-self: flex-end; }
  @keyframes floatIn {
    0% { opacity: 0; transform: translateY(12px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bubble-top {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .approved-name {
    color: #f28c28; font-size: 10px; font-weight: 700;
  }
  .approved-stamp {
    color: #f5d020; font-size: 9px; opacity: 0.4;
    cursor: pointer; transition: opacity 0.2s;
    font-variant-numeric: tabular-nums;
  }
  .approved-stamp:hover { opacity: 1; }
  .approved-text { opacity: 0.6; font-size: 12px; line-height: 1.4; }
  .approved-heading {
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.15em; opacity: 0.15; margin-bottom: 14px;
    text-align: center;
  }

  /* --- KEYBOARD HINT --- */
  .kbd-hint {
    position: fixed; bottom: 16px; right: calc(50% - 430px); z-index: 5;
    font-size: 9px; opacity: 0.2; letter-spacing: 0.05em;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .layer { padding: 16px 20px; max-width: 100vw; }
    .logo-wrap { top: 20px; left: 24px; }
    .logo-wrap img { height: 32px; }
    .socials { top: 24px; right: 24px; }
    .panel { width: 100vw; max-width: 100vw; }
    .kbd-hint { display: none; }
    .logo-wrap { left: 20px !important; }
    .socials { right: 20px !important; }
    .panel { right: 0 !important; }
    .viz-canvas { left: 0 !important; }
  }
</style>
</head>

<div class="bg" id="bg"></div>
<div class="grain"></div>
<canvas id="vizCanvas" class="viz-canvas" width="60" height="900"></canvas>

<script>
const sets = [
  { title: "Soul iLL - Mix 01", genre: "House", date: "2025", duration: "1h+", src: "audio/soul-ill-mix-01.mp3",
    tracklist: [] },
];

const audio = document.getElementById('audio');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const progressFill = document.getElementById('progressFill');
const progressWrap = document.getElementById('progressWrap');
const timeElapsed = document.getElementById('timeElapsed');
const timeRemaining = document.getElementById('timeRemaining');
const timeCurrent = document.getElementById('timeCurrent');
const timeDuration = document.getElementById('timeDuration');
const volSlider = document.getElementById('volSlider');
const volOn = document.getElementById('volOn');
const volOff = document.getElementById('volOff');
const panelEl = document.getElementById('panel');
const bg = document.getElementById('bg');
const downloadBtn = document.getElementById('downloadBtn');
const vizCanvas = document.getElementById('vizCanvas');
const vizCtx = vizCanvas.getContext('2d');

let activeBtn = null, activeIdx = -1, isPlaying = false, lastVol = 0.8;
let allBtns = [];
let analyser = null, audioCtx = null, freqData = null;
audio.volume = 0.8;

let vizPhase = 0;

function resizeViz() {
  vizCanvas.width = 60;
  vizCanvas.height = window.innerHeight;
}
resizeViz();
window.addEventListener('resize', resizeViz);

function drawViz() {
  requestAnimationFrame(drawViz);
  const w = 60;
  const h = vizCanvas.height;
  vizCtx.clearRect(0, 0, w, h);

  const numBars = 32;
  const barH = h / numBars;
  const gap = 2;

  if (!analyser || !isPlaying) {
    // Idle: gentle pulsing bars
    vizPhase += 0.025;
    for (let i = 0; i < numBars; i++) {
      const norm = i / numBars;
      const pulse = Math.sin(vizPhase + norm * Math.PI * 2) * 0.5 + 0.5;
      const barW = 8 + pulse * 20;
      const y = i * barH + gap / 2;
      const alpha = 0.15 + pulse * 0.25;
      vizCtx.fillStyle = `rgba(242, 140, 40, ${alpha})`;
      vizCtx.fillRect(0, y, barW, barH - gap);
    }
    return;
  }

  analyser.getByteFrequencyData(freqData);
  const bins = analyser.frequencyBinCount;

  for (let i = 0; i < numBars; i++) {
    const freqIdx = Math.floor((i / numBars) * bins);
    const val = freqData[freqIdx] / 255;
    const barW = 4 + val * 54;
    const y = i * barH + gap / 2;

    const grad = vizCtx.createLinearGradient(0, 0, barW, 0);
    grad.addColorStop(0, `rgba(242, 140, 40, ${0.4 + val * 0.5})`);
    grad.addColorStop(1, `rgba(245, 208, 32, ${0.15 + val * 0.4})`);
    vizCtx.fillStyle = grad;
    vizCtx.fillRect(0, y, barW, barH - gap);
  }

  // Bass pulse on bg
  const bass = freqData.slice(0, 8).reduce((a,b)=>a+b, 0) / 8;
  const scale = 1 + (bass / 255) * 0.03;
  bg.style.transform = `scale(${scale})`;
}

function fmt(s) {
  if (isNaN(s)) return '00:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// --- AUDIO ANALYSER ---
function initAnalyser() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  drawViz();
}
let analyserStarted = false;

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  progressFill.style.width = (audio.currentTime/audio.duration)*100+'%';
  timeCurrent.textContent = fmt(audio.currentTime);
  timeElapsed.textContent = fmt(audio.currentTime);
  timeRemaining.textContent = '-'+fmt(audio.duration-audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => {
  timeDuration.textContent = fmt(audio.duration);
  timeRemaining.textContent = fmt(audio.duration);
});

// --- AUTO-PLAY NEXT ---
audio.addEventListener('ended', () => {
  isPlaying = false;
  playIcon.style.display=''; pauseIcon.style.display='none';
  if (activeIdx < sets.length - 1) {
    openSet(activeIdx + 1, allBtns[activeIdx + 1]);
    if (!analyserStarted) { initAnalyser(); analyserStarted = true; }
    audio.play().then(() => {
      isPlaying = true;
      playIcon.style.display='none'; pauseIcon.style.display='';
    }).catch(()=>{});
  }
});

progressWrap.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const r = progressWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width)*audio.duration;
});

function togglePlay() {
  if (!audio.src) return;
  if (!analyserStarted) { initAnalyser(); analyserStarted = true; }
  if (isPlaying) {
    audio.pause(); playIcon.style.display=''; pauseIcon.style.display='none';
  } else {
    audio.play(); playIcon.style.display='none'; pauseIcon.style.display='';
  }
  isPlaying = !isPlaying;
}
function skip(sec) {
  if (!audio.duration) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
}
function setVolume(v) { audio.volume=v; lastVol=v; volOn.style.display=v==0?'none':''; volOff.style.display=v==0?'':'none'; }
function toggleMute() {
  if (audio.volume>0) { lastVol=audio.volume; audio.volume=0; volSlider.value=0; volOn.style.display='none'; volOff.style.display=''; }
  else { audio.volume=lastVol||0.8; volSlider.value=audio.volume; volOn.style.display=''; volOff.style.display='none'; }
}

// --- BUILD SET LIST ---
const setsEl = document.getElementById('sets');
sets.forEach((s,i) => {
  const btn = document.createElement('button');
  btn.className = 'set-btn';
  btn.innerHTML = `${s.title}<span class="dur">${s.duration}</span>`;
  btn.onclick = () => openSet(i, btn);
  setsEl.appendChild(btn);
  allBtns.push(btn);
});

function openSet(i, btn) {
  const s = sets[i];
  if (activeBtn) activeBtn.classList.remove('active');
  btn.classList.add('active'); activeBtn = btn; activeIdx = i;
  document.getElementById('panelTitle').textContent = s.title;
  document.getElementById('panelInfo').textContent = `${s.genre}  ·  ${s.date}  ·  ${s.duration}`;
  audio.pause(); audio.src = s.src; audio.load();
  isPlaying = false; playIcon.style.display=''; pauseIcon.style.display='none';
  progressFill.style.width='0%'; timeCurrent.textContent='00:00'; timeDuration.textContent='00:00';
  timeElapsed.textContent='00:00'; timeRemaining.textContent='00:00';
  downloadBtn.href = s.src;
  let html = '';
  if (s.tracklist.length > 0) {
    html = '<div class="tl-heading">Tracklist</div>';
    s.tracklist.forEach((t,j) => { html += `<div class="tl-item"><span class="tl-num">${String(j+1).padStart(2,'0')}</span><span><span class="tl-artist">${t[0]}</span> — <span class="tl-track">${t[1]}</span></span></div>`; });
  } else {
    html = '<div class="tl-heading">Tracklist</div><div style="font-size:11px;opacity:0.2;font-style:italic">Coming soon</div>';
  }
  document.getElementById('panelTracklist').innerHTML = html;
  renderComments();
  renderApproved();
  panelEl.classList.add('open');
}

function closePanel() {
  panelEl.classList.remove('open');
  if (activeBtn) activeBtn.classList.remove('active'); activeBtn = null; activeIdx = -1;
  audio.pause(); isPlaying = false;
  playIcon.style.display=''; pauseIcon.style.display='none';
}

// --- COMMENTS ---
const commentsStore = {}; // { setIndex: [{time, timeStr, name, text, when, approved}] }
const commentTime = document.getElementById('commentTime');
const commentName = document.getElementById('commentName');
const commentInput = document.getElementById('commentInput');
const commentsList = document.getElementById('commentsList');
const approvedArea = document.getElementById('approvedArea');

// Update timestamp field with current playback position
audio.addEventListener('timeupdate', function updateCommentTime() {
  if (!audio.duration) return;
  commentTime.value = fmt(audio.currentTime);
});

function addComment() {
  if (activeIdx === undefined || activeIdx === null || activeIdx < 0) return;
  const text = (commentInput.value || '').trim();
  const name = (commentName.value || '').trim() || 'Anon';
  if (!text) return;

  if (!commentsStore[activeIdx]) commentsStore[activeIdx] = [];

  const timeStr = commentTime.value || '00:00';
  const timeSec = parseTime(timeStr);

  commentsStore[activeIdx].push({
    time: timeSec,
    timeStr: timeStr,
    name: name,
    text: text,
    when: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    approved: false
  });

  commentsStore[activeIdx].sort((a, b) => a.time - b.time);
  commentInput.value = '';
  renderComments();
  // Scroll to show new comment
  setTimeout(() => { commentsList.scrollTop = commentsList.scrollHeight; }, 50);
}

function approveComment(setIdx, commentIdx) {
  if (commentsStore[setIdx] && commentsStore[setIdx][commentIdx]) {
    commentsStore[setIdx][commentIdx].approved = true;
    renderComments();
    renderApproved();
  }
}

function parseTime(str) {
  const parts = str.split(':').map(Number);
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return 0;
}

function renderComments() {
  if (activeIdx < 0) return;
  const comments = commentsStore[activeIdx] || [];
  if (comments.length === 0) {
    commentsList.innerHTML = '<div class="no-comments">No comments yet</div>';
    return;
  }
  commentsList.innerHTML = comments.map((c, i) =>
    `<div class="comment-item${c.approved ? '' : ' comment-pending'}">
      <span class="comment-stamp" onclick="seekTo(${c.time})">${c.timeStr}</span>
      <span class="comment-text"><strong>${escapeHtml(c.name)}</strong> — ${escapeHtml(c.text)}</span>
      ${c.approved
        ? '<span class="comment-when">✓</span>'
        : `<span class="comment-when" style="cursor:pointer;opacity:0.5" onclick="approveComment(${activeIdx},${i})" title="Approve">approve</span>`
      }
    </div>`
  ).join('');
}

function renderApproved() {
  // Gather all approved comments across all sets
  let all = [];
  for (const idx in commentsStore) {
    const setTitle = sets[idx].title;
    commentsStore[idx].forEach(c => {
      if (c.approved) {
        all.push({ ...c, setTitle, setIdx: Number(idx) });
      }
    });
  }

  if (all.length === 0) {
    approvedArea.innerHTML = '';
    return;
  }

  // Sort by most recent first
  all.reverse();

  approvedArea.innerHTML =
    '<div class="approved-heading">Listener Comments</div>' +
    all.map((c, i) =>
      `<div class="approved-comment" style="animation-delay:${i * 0.1}s">
        <div class="bubble-top">
          <span class="approved-name">${escapeHtml(c.name)}</span>
          <span class="approved-stamp" onclick="seekTo(${c.time})">@ ${c.timeStr}</span>
        </div>
        <div class="approved-text">${escapeHtml(c.text)}</div>
      </div>`
    ).join('');
}

function seekTo(seconds) {
  if (!audio.duration) return;
  audio.currentTime = Math.min(seconds, audio.duration);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Submit on click or Enter
document.getElementById('commentPost').addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  addComment();
});
commentInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); addComment(); }
});

// --- KEYBOARD SHORTCUTS ---
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.code) {
    case 'Space':
      e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft':
      e.preventDefault(); if (audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 30); break;
    case 'ArrowRight':
      e.preventDefault(); if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 30); break;
    case 'ArrowUp':
      e.preventDefault(); audio.volume = Math.min(1, audio.volume + 0.05);
      volSlider.value = audio.volume; lastVol = audio.volume; break;
    case 'ArrowDown':
      e.preventDefault(); audio.volume = Math.max(0, audio.volume - 0.05);
      volSlider.value = audio.volume; lastVol = audio.volume; break;
  }
});

// --- PARTICLES ---
// Start idle viz
drawViz();
</script>
</body>
</html>
